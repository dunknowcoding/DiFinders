sentence=Distance, proximity, motion, and ToF sensors for Arduino-compatible boards.

paragraph=DiFinders is a lightweight, modular sensor library for Arduino-compatible MCUs: AVR, Renesas UNO R4, ESP32, SAMD, STM32, RP2040/RP2350, ArduinoNRF (nRF52), Adafruit/Mbed Nordic nRF52/nRF53, and more. Drivers cover HC-SR04-style ultrasonics, UART modules (US-100, A02YYUW, TFMini, HLK-LD24xx), Sharp IR, PIR, ST VL53/VL6180 ToF (I2C and SPI), Modbus RS485, and common reseller aliases (TOF050C/200C/400C). Maintained by dunknowcoding for NiusRobotLab.

