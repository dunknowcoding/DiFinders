name: Arduino CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Example lint (legacy API + English)
        run: |
          python .github/scripts/lint_examples.py
          python .github/scripts/check_docs_english.py
      - name: ALIAS_INDEX must be committed output of generator
        run: python .github/scripts/check_alias_index.py

  compile-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fqbn: arduino:avr:uno
            core: arduino:avr
          - fqbn: arduino:renesas_uno:minima
            core: arduino:renesas_uno
          - fqbn: esp32:esp32:esp32
            core: esp32:esp32
          - fqbn: rp2040:rp2040:rpipico
            core: rp2040:rp2040
            rp2040_index: true
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v1
      - name: Install cores
        run: |
          arduino-cli config init --dest-dir "$HOME/.arduino15" 2>/dev/null || true
          if [ "${{ matrix.rp2040_index }}" = "true" ]; then
            arduino-cli config add board_manager.additional_urls \
              https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          fi
          arduino-cli core update-index
          arduino-cli core install "${{ matrix.core }}"
      - name: Compile Library_CompileSmoke
        run: |
          arduino-cli compile \
            --fqbn "${{ matrix.fqbn }}" \
            --libraries "${{ github.workspace }}" \
            "${{ github.workspace }}/examples/Library_CompileSmoke"

  esp32-uart-samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v1
      - name: Install ESP32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
      - name: Compile UART sample sketches
        run: python .github/scripts/compile_sample_uart_examples.py

  high-rate-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v1
      - name: Install cores
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:renesas_uno esp32:esp32
      - name: Compile high-rate examples
        run: python .github/scripts/compile_high_rate_examples.py

  can-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v1
      - name: Install cores and MCP2515 library
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:renesas_uno esp32:esp32
          arduino-cli lib install "autowp-mcp2515"
      - name: Compile CAN examples
        run: python .github/scripts/compile_can_examples.py

